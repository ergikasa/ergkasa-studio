# Local development only. Matches infra/docker-compose.yml.
# These are throwaway credentials for a database that only listens on your machine; not secrets.
# Used by default when no profile is set (spring.profiles.default in application.yml): .\mvnw.cmd spring-boot:run
spring:
  datasource:
    url: jdbc:postgresql://localhost:5404/erkasa
    username: erkasa
    password: erkasa_local
  rabbitmq:
    username: erkasa
    password: erkasa_local

management:
  endpoint:
    health:
      show-details: always
