name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript (lint, types, contracts)
    # pinned (not ubuntu-latest): the FFmpeg build below is the noble package, the same as on the dev machine
    runs-on: ubuntu-24.04
    env:
      # exact Debian version of Ubuntu 24.04's ffmpeg (= the local 6.1.1-3ubuntu5); a different build fails the job
      FFMPEG_DEB_VERSION: "7:6.1.1-3ubuntu5"
      FFMPEG_VERSION_LINE: "ffmpeg version 7.0.0 "
    steps:
      - uses: actions/checkout@v4
      - name: FFmpeg (pinned version)
        run: |
          sudo apt-get update -o Acquire::Retries=3
          pkgs=""
          for p in ffmpeg libavcodec60 libavdevice60 libavfilter9 libavformat60 libavutil58 libpostproc57 libswresample4 libswscale7; do
            pkgs="$pkgs $p=$FFMPEG_DEB_VERSION"
          done
          sudo apt-get install -y --no-install-recommends $pkgs
          ffmpeg -version | tee "$RUNNER_TEMP/ffmpeg-version.txt"
          ffprobe -version | head -1
          head -1 "$RUNNER_TEMP/ffmpeg-version.txt" | grep -F "$FFMPEG_VERSION_LINE" \
            || { echo "::error::expected '$FFMPEG_VERSION_LINE'"; exit 1; }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - name: JSON Schemas are up to date
        run: pnpm --filter @erkasa/contracts exec tsx scripts/export-json-schema.ts --check
      - run: pnpm test
      - name: Golden baselines (legacy and package), unchanged
        run: |
          pnpm --filter @erkasa/film golden
          pnpm --filter @erkasa/film golden:package

  assets:
    name: Asset library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/asset-validate/validate.py

  backend:
    name: Backend (Spring Boot, Java 21)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: erkasa
          POSTGRES_USER: erkasa
          POSTGRES_PASSWORD: erkasa_local
        ports:
          - 5404:5432
        options: >-
          --health-cmd "pg_isready -U erkasa -d erkasa"
          --health-interval 5s --health-timeout 3s --health-retries 20
      rabbitmq:
        image: rabbitmq:4-alpine
        env:
          RABBITMQ_DEFAULT_USER: erkasa
          RABBITMQ_DEFAULT_PASS: erkasa_local
        ports:
          - 5673:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./mvnw -B -ntp verify
        working-directory: backend
      # the runnable backend jar, kept for a few days (handy for trying a branch without building)
      - uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/erkasa-studio-backend-*.jar
          retention-days: 3
