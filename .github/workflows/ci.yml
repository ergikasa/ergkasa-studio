name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript (lint, types, contracts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - name: JSON Schemas are up to date
        run: pnpm --filter @erkasa/contracts exec tsx scripts/export-json-schema.ts --check
      - run: pnpm test

  assets:
    name: Asset library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/asset-validate/validate.py

  backend:
    name: Backend (Spring Boot, Java 21)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: erkasa
          POSTGRES_USER: erkasa
          POSTGRES_PASSWORD: erkasa_local
        ports:
          - 5404:5432
        options: >-
          --health-cmd "pg_isready -U erkasa -d erkasa"
          --health-interval 5s --health-timeout 3s --health-retries 20
      rabbitmq:
        image: rabbitmq:4-alpine
        env:
          RABBITMQ_DEFAULT_USER: erkasa
          RABBITMQ_DEFAULT_PASS: erkasa_local
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./mvnw -B -ntp verify
        working-directory: backend
      # the runnable backend jar, kept for a few days (handy for trying a branch without building)
      - uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/erkasa-studio-backend-*.jar
          retention-days: 3
