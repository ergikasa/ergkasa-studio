# Local infrastructure for Erkasa Studio.
#   docker compose -f infra/docker-compose.yml up -d
# Every port binds to 127.0.0.1 only. Credentials here are local throwaway values (see .env.example).
name: ergkasa-studio

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: erkasa
      POSTGRES_USER: erkasa
      POSTGRES_PASSWORD: erkasa_local
    ports:
      - "127.0.0.1:5404:5432" # host 5404 (5432 is taken by other local projects)
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erkasa -d erkasa"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: erkasa
      RABBITMQ_DEFAULT_PASS: erkasa_local
    ports:
      - "127.0.0.1:5672:5672" # AMQP
      - "127.0.0.1:15672:15672" # management UI: http://localhost:15672
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  seaweedfs:
    # Artifact storage with an S3-compatible API (http://localhost:8333).
    # Pin to the exact version you pulled once it works: `docker image inspect chrislusf/seaweedfs`.
    image: chrislusf/seaweedfs:latest
    command: >
      server -dir=/data -ip=seaweedfs -ip.bind=0.0.0.0
      -master.volumeSizeLimitMB=1024 -volume.max=0
      -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "127.0.0.1:8333:8333" # S3 API
      - "127.0.0.1:9333:9333" # master UI
      - "127.0.0.1:8888:8888" # filer UI
    volumes:
      - seaweedfs-data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

volumes:
  postgres-data:
  rabbitmq-data:
  seaweedfs-data:
